# See docker-compose.yml for why; anchors don't cross files.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/anddev741/beyou-backend:latest
    restart: unless-stopped
    logging: *bounded-logging
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-beyou}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-1516}
      UPLOAD_DIR: /data/uploads
    volumes:
      - beyou_uploads:/data/uploads
    ports:
      - "127.0.0.1:8099:8099"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - beyou_net

  frontend:
    image: ghcr.io/anddev741/beyou-web:latest
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - beyou_net

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "300"
      # HTTP API on 8080 (the image's EXPOSE): /v1/update is a POST-only
      # trigger, /v1/metrics is Prometheus exposition. The token is required
      # with no default on purpose — the API server REFUSES to start with an
      # empty token, and the resulting crash would silently kill the updater.
      # Prometheus scrapes /v1/metrics with the same token (see monitoring/prometheus/prometheus.yml.tpl);
      # GlitchTip TCP-checks the port, which needs no token.
      - --http-api
      - --http-api-token=${WATCHTOWER_API_TOKEN:?Must set WATCHTOWER_API_TOKEN — openssl rand -hex 16}
    networks:
      - beyou_net
