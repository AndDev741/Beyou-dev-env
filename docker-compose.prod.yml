# See docker-compose.yml for why; anchors don't cross files.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The base file gives the database a convenience default so a dev box starts
  # with no .env at all. Production is not a dev box: an unset password there
  # would silently deploy the four digits the template used to ship, so this
  # overlay refuses to start instead.
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Must set POSTGRES_PASSWORD}

  backend:
    image: ghcr.io/anddev741/beyou-backend:latest
    restart: unless-stopped
    logging: *bounded-logging
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-beyou}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Must set POSTGRES_PASSWORD}
      UPLOAD_DIR: /data/uploads
    volumes:
      - beyou_uploads:/data/uploads
    ports:
      - "127.0.0.1:8099:8099"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - beyou_net

  frontend:
    image: ghcr.io/anddev741/beyou-web:latest
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - beyou_net

  # Engineering documentation site (docs.beyouweb.com). Static, prerendered HTML
  # served by its own nginx, which also proxies /api/v1/ to `backend` so the
  # pages fetch their content same-origin — that is why nothing had to be added
  # to CORS_ALLOWED_PATTERN for this host.
  #
  # The content itself is baked in at image build time: CI pulls every topic
  # from the public docs API and writes one HTML file per route. A content
  # change therefore ships as a new image, not as a restart — beyou-arch-design
  # dispatches the docs-ui workflow after its import runs.
  docs:
    image: ghcr.io/anddev741/beyou-docs:latest
    restart: unless-stopped
    logging: *bounded-logging
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - beyou_net

  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "300"
      # HTTP API on 8080 (the image's EXPOSE), metrics endpoint ONLY: this
      # gives Prometheus /v1/metrics (see monitoring/prometheus/prometheus.yml.tpl)
      # and GlitchTip a TCP port to probe, without an update trigger nobody
      # calls.
      #
      # Do NOT add `update` to this list casually: enabling the update endpoint
      # switches watchtower to API-triggered mode and SILENTLY STOPS the
      # --interval polling above ("HTTP API enabled and periodic updates
      # disabled" in its log), which is the whole auto-deploy mechanism. If
      # /v1/update is ever needed, add `--http-api-periodic-polls` in the same
      # breath to keep the timer running.
      #
      # The flag is --http-api-endpoints (a list); there is no bare --http-api
      # in this image — it exits with "unknown flag" and restart:unless-stopped
      # turns that into a crash loop that kills the updater.
      #
      # The token is required with no default on purpose: the API server
      # refuses to start with an empty token when a non-health endpoint is
      # enabled. Keep it HEX — it is injected into prometheus.yml through a sed
      # expression delimited by `|`, so `|`, `&` or `\` would corrupt the config.
      - --http-api-endpoints=metrics
      - --http-api-token=${WATCHTOWER_API_TOKEN:?Must set WATCHTOWER_API_TOKEN — openssl rand -hex 16}
    networks:
      - beyou_net
