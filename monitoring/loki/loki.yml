# Loki in single-binary mode with filesystem storage — sized for this stack's
# reality: one host, one writer (Alloy), a handful of containers. No object
# store, no microservices split, no HA ring. Scaling past one host means
# revisiting this file wholesale, not tweaking it.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  # Single-binary mode still runs the ingester ring internally; pin the
  # instance address so ring membership never depends on what the container's
  # hostname resolves to.
  instance_addr: 127.0.0.1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      # v13 + TSDB is the minimum for structured metadata, which is where
      # detected_level (below) lives. Downgrading either silently disables
      # level detection.
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Bounded store, same philosophy (and same number) as GLITCHTIP_RETENTION_DAYS:
  # 30 days, then gone. Enforced by the compactor block below — retention_period
  # alone only *marks* data as expired.
  retention_period: 720h
  # Server-side log-level detection: Loki parses each incoming line (JSON keys,
  # logfmt, plain-text keywords) and attaches `detected_level` as structured
  # metadata. This is why Alloy ships raw lines with no per-format regex stages:
  # one detector here covers Spring's text layout, nginx, and Postgres at once.
  # Filter with:  | detected_level="error"
  discover_log_levels: true
  allow_structured_metadata: true
  # Lets Grafana's log-volume histogram use the index instead of a full query.
  volume_enabled: true

# Powers the "Patterns" tab in Grafana's Logs Drilldown (Drilldown -> Logs):
# clusters similar lines into templates so a log flood reads as "3 patterns,
# one of them new" instead of ten thousand lines. Patterns are computed from
# LIVE ingestion only — after a Loki restart the tab starts empty and refills
# as logs flow; history is not back-mined.
pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/compactor
  # retention_enabled is what actually deletes expired chunks; without it the
  # retention_period above is decorative and the volume grows unchecked.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
