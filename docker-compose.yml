# Docker's json-file driver keeps logs forever by default; on a long-lived
# host that is an unbounded disk leak. 10m x 3 bounds each container at ~30MB
# of `docker logs` history. Loki (docker-compose.monitoring.yml) is the place
# for real history — Alloy tails the Docker API, so rotation loses it nothing.
# Anchors don't cross files: each compose file that defines services carries
# its own copy of this block.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beyou}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1516}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5490}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-beyou}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - beyou_net

networks:
  beyou_net:
    name: beyou_net

volumes:
  postgres_data: {}
  beyou_uploads: {}
