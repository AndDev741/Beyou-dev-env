services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beyou}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1516}
    # Host port is published by docker-compose.yml (127.0.0.1:5490:5432).
    # Re-declaring it here produced a duplicate, overlapping 5490 binding that
    # wedged the container (no published port, detached from beyou_net). Do not re-add.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-beyou}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - beyou_net

  backend:
    build:
      context: ../Beyou-backend-spring
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ../Beyou-backend-spring:/app
      # Keep container build output off the host's target/ — prevents two Mavens
      # (host + container) corrupting the same classes dir and root-owned leftovers.
      - beyou_backend_target:/app/target
      - beyou_maven_repo:/root/.m2
      - beyou_uploads:/data/uploads
    env_file:
      - .env
    environment:
      # Override any JAVA_OPTS coming from `.env` so heap sizing is controlled consistently here.
      JAVA_OPTS: ""
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
      UPLOAD_DIR: /data/uploads
    ports:
      - "8099:8099"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beyou_net     
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  frontend:
    build:
      context: ../Beyou-Frontend
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      - ../Beyou-Frontend:/app
      - beyou_frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - beyou_net

volumes:
  beyou_maven_repo: {}
  beyou_backend_target: {}
  beyou_frontend_node_modules: {}
  postgres_data: {}
  beyou_uploads: {}

networks:
  beyou_net:
    name: beyou_net
