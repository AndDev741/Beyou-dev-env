# Bounded on-disk logs for every service in this file. Alloy reads through the
# Docker API, not the files, so rotation never costs Loki a line — it only
# stops `docker logs` history growing without limit.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    ports:
      # Loopback-bound like every service in docker-compose.prod.yml. This
      # overlay was the outlier: an actuator, an unauthenticated Prometheus query
      # API and a Grafana admin login were all reachable from the network, and
      # up-prod.sh --monitoring makes that a supported production start.
      - "${MONITORING_BIND:-127.0.0.1}:${MANAGEMENT_PORT:-9091}:${MANAGEMENT_PORT:-9091}"

  prometheus:
    image: prom/prometheus:v3.3.0
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - ./monitoring/prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
    environment:
      # prometheus.yml.tpl carries @VAR@ tokens that THIS entrypoint renders
      # with sed (Prometheus itself never expands env vars in config files,
      # and the mounted template is read-only). Compose guarantees the
      # defaults here, which is what keeps the config portable to a deployment
      # that does not run this compose stack: set the same variables there.
      CADVISOR_PORT: ${CADVISOR_PORT:-8080}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      POSTGRES_EXPORTER_PORT: ${POSTGRES_EXPORTER_PORT:-9187}
      # Bearer token for watchtower's /v1/metrics. Empty default: watchtower
      # only exists in the prod overlay, so in dev this scrape is down by
      # design and the empty credentials get the target a 401, never a load
      # failure. Set WATCHTOWER_API_TOKEN where watchtower runs (prod.yml
      # requires it).
      WATCHTOWER_API_TOKEN: ${WATCHTOWER_API_TOKEN:-}
    entrypoint:
      - /bin/sh
      - -ec
      # Render the template into /etc/prometheus/prometheus.yml (writable in
      # the image even under USER nobody), then hand over to the real
      # process. $$ escapes compose interpolation so the shell sees $VAR.
      # Keep the sed list in sync with the @VAR@ tokens in prometheus.yml.tpl.
      - |
        sed \
          -e 's|@CADVISOR_PORT@|'"$$CADVISOR_PORT"'|g' \
          -e 's|@NODE_EXPORTER_PORT@|'"$$NODE_EXPORTER_PORT"'|g' \
          -e 's|@POSTGRES_EXPORTER_PORT@|'"$$POSTGRES_EXPORTER_PORT"'|g' \
          -e 's|@WATCHTOWER_API_TOKEN@|'"$$WATCHTOWER_API_TOKEN"'|g' \
          /etc/prometheus/prometheus.yml.tpl > /etc/prometheus/prometheus.yml
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    ports:
      # /api/v1/query is unauthenticated — anything reachable here can read every
      # metric the stack collects.
      - "${MONITORING_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    networks:
      - beyou_net

  grafana:
    # Keep this pin reasonably current. The Drilldown apps (Logs Drilldown et
    # al.) are downloaded and AUTO-UPDATED by Grafana itself, and new plugin
    # builds eventually assume a newer Grafana than a stale pin — 11.6.0 broke
    # exactly that way: Logs Drilldown 1.0.39 imported react/jsx-runtime,
    # which 11.6.0's module registry doesn't expose, and the app died with
    # "App not found" while claiming compatibility. A pinned Grafana with
    # unpinned plugins is a slow-motion version conflict.
    image: grafana/grafana:12.4.6
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required, no default. The previous `:-admin` combined with an empty
      # GRAFANA_ADMIN_PASSWORD= in .env.example meant an unedited copy published
      # Grafana as admin/admin — and a Grafana admin can add a datasource that
      # proxies anywhere inside beyou_net.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Must set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Grafana's own /metrics endpoint (Prometheus exposition, no auth when
      # enabled). Scraped as job "grafana" so the dashboard sees Grafana
      # answering; the endpoint is internal-only (no published port), and
      # deep health (/api/health) is GlitchTip's monitor, not a scrape.
      GF_METRICS_ENABLED: ${GRAFANA_METRICS_ENABLED:-true}
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - beyou_net

  # --- Loki + Alloy: unified log aggregation ----------------------------------
  # Every container in the Beyou compose projects already writes its logs to
  # Docker stdout — Spring backend, nginx/Vite frontend, Postgres, and the
  # monitoring services themselves. Alloy tails all of them through the Docker
  # API and pushes to Loki; Grafana (above) queries Loki as a provisioned
  # datasource. Complementary to GlitchTip, not overlapping: GlitchTip answers
  # "what broke" (error events, incl. browsers), Loki answers "what happened"
  # (every log line, 30-day retention).
  loki:
    image: grafana/loki:3.7.4
    restart: unless-stopped
    logging: *bounded-logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # NO published port, deliberately — Loki's push and query APIs are
    # unauthenticated (auth_enabled: false), and its only clients are Alloy
    # and Grafana, both on beyou_net. Reading logs happens through Grafana,
    # which is the component with a login in front of it.
    #
    # No compose healthcheck, and not for lack of trying: the image is
    # distroless (no shell, no wget/curl — verified against 3.7.4), so there is
    # nothing to exec a probe with. Liveness is `up{job="loki"}` via the
    # Prometheus scrape in monitoring/prometheus/prometheus.yml.tpl, which is the
    # signal that matters anyway — a dead log store fails silent, and only
    # something OUTSIDE the container notices silence.
    networks:
      - beyou_net

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    logging: *bounded-logging
    command:
      # Listen on 0.0.0.0 INSIDE the container (image default is the same) so
      # Prometheus can scrape alloy:12345 over beyou_net; what the host sees
      # is governed by the ports: entry below, not by this flag.
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only socket mount, same pattern watchtower already uses in
      # docker-compose.prod.yml (and watchtower's is read-write). :ro protects
      # the socket file, not the API — a process holding this socket can still
      # control the Docker daemon, i.e. the host. Acceptable here because the
      # container runs one Grafana-built binary with a config from this repo,
      # and log collection via the API is what keeps app containers free of
      # log-shipper sidecars and file-path conventions.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read positions, so a restart resumes tailing instead of re-ingesting.
      - alloy_data:/var/lib/alloy/data
    ports:
      # Alloy's debugging UI (component graph, discovered targets, live
      # pipeline health). Unauthenticated and it exposes /-/reload, so it gets
      # the same loopback-only treatment as Prometheus above.
      - "${MONITORING_BIND:-127.0.0.1}:${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki
    networks:
      - beyou_net

  # --- GlitchTip: self-hosted error telemetry collector -----------------------
  # Speaks the Sentry API, so the official Sentry SDKs (backend, web, mobile)
  # point at it by DSN. Lives here rather than in the base stack because it is
  # observability infrastructure alongside Prometheus/Grafana, and because it
  # must sit on `beyou_net` to reach the backend management port (9091) for the
  # uptime + heartbeat monitors.
  #
  # Its Postgres and Valkey are deliberately NOT on `beyou_net` — only the web
  # service is dual-homed, so the app network cannot see GlitchTip's datastores.
  glitchtip-db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: ${GLITCHTIP_DB_NAME:-glitchtip}
      POSTGRES_USER: ${GLITCHTIP_DB_USER:-glitchtip}
      # Required on BOTH sides, deliberately. A default here with a required
      # value on the client's DATABASE_URL is the worse failure: Postgres only
      # reads POSTGRES_PASSWORD on first init, so once the volume exists this
      # value is inert — changing it later silently breaks the connection
      # instead of rotating anything. Same variable, same expectation, both ends.
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?Must set GLITCHTIP_DB_PASSWORD}
    volumes:
      # Postgres 18 images relocated PGDATA; the declared volume is the whole
      # /var/lib/postgresql tree, not /var/lib/postgresql/data.
      - glitchtip_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_DB_USER:-glitchtip} -d ${GLITCHTIP_DB_NAME:-glitchtip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - glitchtip_net

  glitchtip-valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    logging: *bounded-logging
    networks:
      - glitchtip_net

  glitchtip:
    image: glitchtip/glitchtip:6.2.2
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      # GlitchTip 6 ships web + background worker + startup migrations in one
      # process under this role. There is no separate worker/migrate service to
      # run any more; migrations execute automatically on container start.
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:?Must set GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      VALKEY_URL: redis://glitchtip-valkey:6379
      # Required. No default on purpose — an empty value fails the container
      # loudly rather than shipping a known secret. openssl rand -hex 32
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Must set GLITCHTIP_SECRET_KEY — openssl rand -hex 32}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      # consolemail:// prints mail to the container log — fine for local dev,
      # but new-issue alerts (R17) need a real SMTP URL in a deployed stack.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      # Registration lock: the FIRST account can always self-register; every
      # later signup is blocked while this is False. Leave it False.
      ENABLE_USER_REGISTRATION: ${GLITCHTIP_ENABLE_USER_REGISTRATION:-False}
      ENABLE_ORGANIZATION_CREATION: "False"
      # Bounded event store. Without this the default is 90 days and the
      # Postgres volume grows unchecked.
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-30}
      # Uptime monitors default to refusing private/RFC1918 targets (SSRF
      # guard). The backend is only reachable at http://backend:9091 inside
      # beyou_net, so the guard has to be relaxed for the U17 monitors.
      GLITCHTIP_UPTIME_ALLOW_PRIVATE_IPS: "True"
      GLITCHTIP_ENABLE_UPTIME: "True"
      # Exposes GlitchTip's own django-prometheus endpoint at GET /metrics (off
      # by default). Scraped as job "glitchtip" in monitoring/prometheus/prometheus.yml.tpl
      # so the collector's liveness is observable from something that is NOT the
      # collector — see the long comment there for why that matters.
      #
      # The view is unauthenticated. It exports only counts
      # (glitchtip_organizations, glitchtip_projects_total) plus django-prometheus
      # request/db histograms — no org names, no DSNs, no event contents — and
      # port 8000 is loopback-bound, so the added surface is bounded. Anything
      # that can already reach beyou_net can read it.
      ENABLE_OBSERVABILITY_API: "True"
    volumes:
      # Sourcemap / debug-symbol uploads.
      - glitchtip_uploads:/code/uploads
    healthcheck:
      # Without this, Compose reported the collector "Up" while it was wedged —
      # and since every alert rule, every notification and all three app DSNs
      # terminate in GlitchTip, a wedged collector makes the entire stack look
      # quiet instead of broken.
      #
      # /code/healthcheck.py ships in the image for exactly this purpose (GETs
      # /_health/ on localhost:8000, exits 0 only on HTTP 200). Preferred over a
      # hand-rolled probe: it tracks the health path across upgrades, and the
      # image carries neither curl nor wget — python is the only client in it.
      test: ["CMD", "python", "/code/healthcheck.py"]
      interval: 15s
      timeout: 10s
      # First boot applies migrations before it starts serving, which takes a
      # minute or two — without this the container reports unhealthy the whole time.
      start_period: 120s
      retries: 5
    ports:
      # Loopback-bound. GlitchTip lets the FIRST account self-register as admin
      # regardless of ENABLE_USER_REGISTRATION, so between `up` and the moment
      # you register, whoever reaches this port owns the collector — every error
      # event and every uploaded source map, which is the web app's source.
      # Reach it from another host through a tunnel or reverse proxy, never by
      # publishing it. Override only if you know why.
      - "${GLITCHTIP_BIND:-127.0.0.1}:${GLITCHTIP_PORT:-8000}:8000"
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_started
    networks:
      - beyou_net
      - glitchtip_net

  # --- Container + host exporters -------------------------------------------
  # Feed the "Beyou — Containers" dashboard. Without cAdvisor there is no
  # per-container resource data anywhere in the stack (GlitchTip answers "is it
  # answering?", these answer "what is it using?"). All three publish NO host
  # port, like loki: their only clients are Prometheus and Grafana on
  # beyou_net. Ports are overridable via CADVISOR_PORT / NODE_EXPORTER_PORT /
  # POSTGRES_EXPORTER_PORT for a deployment that maps them differently.
  #
  # cAdvisor reads the Docker API (same trust level alloy and watchtower
  # already assume here, but read-write: it lists containers, it does not tail
  # logs) plus the cgroup/sysfs filesystems. It reports EVERY container on the
  # host, so the dashboard filters to compose projects whose name starts with
  # "beyou" — mirroring the keep rule in monitoring/alloy/config.alloy.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    logging: *bounded-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --listen_ip=0.0.0.0
      - --port=${CADVISOR_PORT:-8080}
    networks:
      - beyou_net

  # node-exporter: the host itself. "The JVM is fine but the box is swapping"
  # is exactly the question this answers, and today the stack cannot even ask.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:${NODE_EXPORTER_PORT:-9100}
    networks:
      - beyou_net

  # postgres-exporter: the app DB seen from the DB's own side, not through the
  # backend's connection pool. Gives connections, cache hit ratio, deadlocks,
  # locks and size; pg_up is the dashboard's "the database is answering"
  # signal, one that does not need a TCP probe exporter.
  #
  # DATA_SOURCE_NAME carries the password like every other consumer of .env in
  # this repo. If a deployment's password contains URL-reserved characters it
  # must be percent-encoded here — that is why the connection string is built
  # from parts rather than quoted wholesale.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1516}@db:5432/${POSTGRES_DB:-beyou}?sslmode=disable
    command:
      - --web.listen-address=:${POSTGRES_EXPORTER_PORT:-9187}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - beyou_net

volumes:
  grafana_data: {}
  loki_data: {}
  alloy_data: {}
  glitchtip_pg_data: {}
  glitchtip_uploads: {}

networks:
  beyou_net:
    name: beyou_net
  glitchtip_net:
    name: glitchtip_net
